  <rect x="430" y="112" width="190" height="58" rx="3"/>
  <rect x="630" y="116" width="145" height="52" rx="3"/>
  <rect x="285" y="265" width="118" height="40" rx="3"/>
  <rect x="420" y="266" width="132" height="38" rx="3"/>
</g>
<g fill="#b9b29e" opacity=".45">
  <rect x="1040" y="110" width="90" height="34"/><rect x="1140" y="92" width="130" height="42"/>
  <rect x="1385" y="140" width="85" height="38"/>
</g>
<!-- internal service roads, deliberately not the racing surface -->
<g fill="none" stroke="#7b8273" stroke-linecap="round" opacity=".55">
  <path d="M230 350 C390 385 520 420 665 495 S885 565 980 470" stroke-width="12"/>
  <path d="M260 620 C360 570 470 575 585 630 S770 690 860 630" stroke-width="10"/>
