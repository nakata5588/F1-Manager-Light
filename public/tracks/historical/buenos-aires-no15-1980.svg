<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1649 954" role="img" aria-labelledby="title desc">
<title id="title">Buenos Aires Circuit No. 15 — 1980 historical environment</title>
<desc id="desc">Presentation-only video-game aerial environment. Functional centreline, sectors, pit lane and race state remain authoritative.</desc>
<defs>
  <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#29431f"/><stop offset=".38" stop-color="#46652e"/><stop offset=".72" stop-color="#5b7637"/><stop offset="1" stop-color="#304923"/>
  </linearGradient>
  <radialGradient id="treeCrown"><stop stop-color="#6f932e"/><stop offset=".45" stop-color="#426b22"/><stop offset="1" stop-color="#18391d"/></radialGradient>
  <linearGradient id="water" x1=".1" y1=".1" x2=".9" y2=".9">
    <stop stop-color="#246a73"/><stop offset=".48" stop-color="#1e5d67"/><stop offset="1" stop-color="#123f4b"/>
  </linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8ddd8"/><stop offset="1" stop-color="#8d9995"/></linearGradient>
  <pattern id="mow" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <rect width="36" height="72" fill="#ffffff" opacity=".018"/><rect x="36" width="36" height="72" fill="#000000" opacity=".018"/>
  </pattern>
  <pattern id="waterLines" width="54" height="26" patternUnits="userSpaceOnUse">
    <path d="M2 12 C12 7 22 17 34 11 S48 8 54 12" fill="none" stroke="#a7e0df" stroke-width="1" opacity=".08"/>
  </pattern>
  <symbol id="tree" viewBox="-16 -18 32 36">
    <ellipse cx="4" cy="10" rx="11" ry="5" fill="#102918" opacity=".42"/>
    <rect x="-1.5" y="5" width="3" height="9" rx="1.5" fill="#5c4326"/>
    <ellipse cx="-5" cy="-2" rx="8.5" ry="9" fill="#274f20"/>
    <ellipse cx="5" cy="-4" rx="9.5" ry="10" fill="#335f22"/>
    <ellipse cx="0" cy="-8" rx="9" ry="10" fill="url(#treeCrown)"/>
    <ellipse cx="-2" cy="-11" rx="4.5" ry="3.5" fill="#8aa53b" opacity=".45"/>
  </symbol>
  <symbol id="stand" viewBox="0 0 120 34">
    <rect width="120" height="34" rx="3" fill="#26313a" stroke="#a8b1b7" stroke-width="2"/>
    <g stroke="#d15d55" stroke-width="4" opacity=".9">
      <path d="M8 8h104M8 17h104M8 26h104"/>
    </g>
    <g stroke="#c9d1d7" stroke-width="2" opacity=".75">
      <path d="M18 4v26M38 4v26M58 4v26M78 4v26M98 4v26"/>
    </g>
  </symbol>
</defs>

