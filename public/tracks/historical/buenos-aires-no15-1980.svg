 C1390 360 1490 430 1502 540
 C1515 663 1425 748 1288 777
 C1125 812 895 805 735 770
 C606 742 555 665 561 567
 C566 482 574 405 615 365Z"
 fill="url(#water)" stroke="#35554d" stroke-width="10"/>
<!-- tree masses -->
<g fill="#1f4329" opacity=".88">
  <circle cx="130" cy="150" r="34"/><circle cx="185" cy="175" r="28"/><circle cx="225" cy="125" r="25"/>
  <circle cx="805" cy="160" r="31"/><circle cx="852" cy="178" r="24"/><circle cx="910" cy="145" r="29"/>
  <circle cx="1030" cy="250" r="24"/><circle cx="1095" cy="220" r="31"/><circle cx="1170" cy="205" r="26"/>
  <circle cx="205" cy="665" r="31"/><circle cx="260" cy="715" r="27"/><circle cx="350" cy="780" r="31"/>
  <circle cx="535" cy="845" r="24"/><circle cx="930" cy="860" r="24"/><circle cx="1450" cy="810" r="30"/>
</g>
