  <path d="M85 120 C160 205 135 310 112 410 S115 650 82 820" stroke-width="11"/>
  <path d="M720 70 C760 145 740 220 706 310" stroke-width="10"/>
</g>
<!-- paddock / buildings along upper straight -->
<g fill="#9ca08f" stroke="#53594f" stroke-width="4" opacity=".9">
