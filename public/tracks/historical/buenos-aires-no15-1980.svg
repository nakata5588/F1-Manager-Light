<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1642 958" role="img" aria-labelledby="title desc">
<title id="title">Buenos Aires Circuit No. 15 — 1980 historical environment</title>
<desc id="desc">Presentation-only scenery aligned to the supplied historical reference. Functional centreline and race state remain authoritative.</desc>
<defs>
  <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#445b35"/><stop offset=".52" stop-color="#62794a"/><stop offset="1" stop-color="#3f5333"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20555d"/><stop offset=".55" stop-color="#2f6d70"/><stop offset="1" stop-color="#1d4c55"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<rect width="1642" height="958" fill="url(#grass)"/>
<!-- distant roads / city edge -->
<g fill="none" stroke="#6b7468" opacity=".55">
  <path d="M0 88 C260 55 420 74 620 55 S1050 46 1642 82" stroke-width="20"/>
