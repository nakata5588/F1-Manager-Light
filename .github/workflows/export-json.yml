name: Build and validate game data

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "public/data/**"
      - "data/f1_db.xlsx"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/export-json.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "public/data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/export-json.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: f1ml-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export Excel to runtime JSON
        run: npm run build:data

      - name: Test career season boundary
        run: npm run test:career

      - name: Test driver progression and fatigue
        run: npm run test:drivers

      - name: Test driver simulation core
        run: npm run test:simulation

      - name: Test management systems
        run: npm run test:management

      - name: Test Team Manager profile and gameplay effects
        run: npm run test:manager

      - name: Test management timeline
        run: npm run test:management-events

      - name: Test management depth mechanics
        run: npm run test:management-depth

      - name: Test Development 2.0
        run: npm run test:development

      - name: Test Development regulations
        run: npm run test:development-regulations

      - name: Test Technical Department
        run: npm run test:technical-department

      - name: Test AI technical lifecycle
        run: npm run test:ai-technical

      - name: Test technology adoption lifecycle
        run: npm run test:technology-adoption

      - name: Test AI technical multi-season soak
        run: npm run test:ai-technical-soak

      - name: Test save safety and deterministic RNG
        run: npm run test:save-safety

      - name: Test race entry and driver availability
        run: npm run test:race-entry

      - name: Test race weekend state machine
        run: npm run test:race-weekend

      - name: Test era-aware race strategy
        run: npm run test:race-strategy

      - name: Test live race control
        run: npm run test:live-race

      - name: Test race control and weather effects
        run: npm run test:race-control

      - name: Test weekend weather and forecast evolution
        run: npm run test:weekend-weather

      - name: Test injuries and replacement drivers
        run: npm run test:injuries

      - name: Test health severity and fatality model
        run: npm run test:health

      - name: Test reserve and emergency replacement drivers
        run: npm run test:replacements

      - name: Test AI reserve hiring and missing ratings fallback
        run: npm run test:ai-reserves

      - name: Test driver contract negotiations
        run: npm run test:negotiations

      - name: Test live lineup and driver role management
        run: npm run test:roles

      - name: Test historical New Game opening state
        run: npm run test:opening-state

      - name: Test generated Season Packs
        run: npm run test:season-packs

      - name: Validate runtime JSON
        run: npm run validate:data

      - name: Build application
        run: npm run build

      - name: Commit generated JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "auto: update runtime JSON from Excel"
          git push
