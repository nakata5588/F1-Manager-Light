name: Build and validate game data

on:
  push:
    paths:
      - "data/f1_db.xlsx"
      - "scripts/convert-excel.mjs"
      - "scripts/validate_json.js"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/**"
      - "public/data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: f1ml-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export Excel to runtime JSON
        if: github.event_name != 'pull_request'
        run: npm run build:data

      - name: Test career season boundary
        run: npm run test:career

      - name: Validate runtime JSON
        run: npm run validate:data

      - name: Build application
        run: npm run build

      - name: Commit generated JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "auto: update runtime JSON from Excel"
          git push
