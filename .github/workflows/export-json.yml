name: Build and validate game data

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "tests/**"
      - "public/data/**"
      - "data/f1_db.xlsx"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/export-json.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "public/data/**"
      - "data/f1_db.xlsx"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/export-json.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: f1ml-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export Excel to runtime JSON
        run: npm run build:data

      - name: Test career season boundary
        run: npm run test:career

      - name: Test lower-series catalogue foundation
        run: node --test tests/seriesCatalog.test.js

      - name: Test driver progression and fatigue
        run: npm run test:drivers

      - name: Test historical talent evidence principles
        run: npm run test:talent-evidence

      - name: Test Talent Profile inference principles
        run: npm run test:talent-profiles

      - name: Test historical driver world-entry principles
        run: npm run test:world-entry

      - name: Test generic feeder placement principles
        run: npm run test:world-placement

      - name: Test Lower Series Save World
        run: node --test tests/lowerSeriesWorld.test.js

      - name: Test Lower Series deterministic simulation
        run: node --test tests/lowerSeriesSimulation.test.js tests/lowerSeriesProspects.test.js tests/lowerSeriesCallups.test.js tests/lowerSeriesCareerMovement.test.js tests/lowerSeriesTimeline.test.js tests/driverCareerTimeline.test.js tests/lowerSeriesEntries.test.js

      - name: Test Starting Rating materializer principles
        run: npm run test:starting-ratings

      - name: Test historical talent evidence against real archive
        run: |
          node scripts/build-race-results-archive.mjs
          npm run test:talent-evidence:real
          npm run talent:evidence

      - name: Test Talent Profile inference against real archive
        run: |
          npm run test:talent-profiles:real
          npm run talent:profiles

      - name: Test historical driver world-entry against real population
        run: |
          node scripts/build-driver-history.mjs
          npm run test:world-entry:real
          npm run world:entry

      - name: Test generic feeder placement against real population
        run: |
          npm run test:world-placement:real
          npm run world:placement

      - name: Test Starting Rating calibration against real archive
        run: npm run test:starting-ratings:real

      - name: Test Drivers cross-system integration
        run: npm run test:driver-integration

      - name: Test driver simulation core
        run: npm run test:simulation

      - name: Test Historical Team Strength principles
        run: npm run test:team-strength

      - name: Test management systems
        run: npm run test:management

      - name: Test Team Principal profile and gameplay effects
        run: npm run test:manager

      - name: Test management timeline
        run: npm run test:management-events

      - name: Test management depth mechanics
        run: npm run test:management-depth

      - name: Test Development 2.0
        run: npm run test:development

      - name: Test Development regulations
        run: npm run test:development-regulations

      - name: Test Technical Department
        run: npm run test:technical-department

      - name: Test AI technical lifecycle
        run: npm run test:ai-technical

      - name: Test technology adoption lifecycle
        run: npm run test:technology-adoption

      - name: Test AI technical multi-season soak
        run: npm run test:ai-technical-soak

      - name: Test save safety and deterministic RNG
        run: npm run test:save-safety

      - name: Test race entry and driver availability
        run: npm run test:race-entry

      - name: Test race weekend state machine
        run: npm run test:race-weekend

      - name: Test era-aware race strategy
        run: npm run test:race-strategy

      - name: Test live race control
        run: npm run test:live-race

      - name: Test RW7.1 race parity harness
        run: npm run test:race-parity

      - name: Test historical 2D track layout resolution
        run: npm run test:track-layout

      - name: Test race control and weather effects
        run: npm run test:race-control

      - name: Test weekend weather and forecast evolution
        run: npm run test:weekend-weather

      - name: Test injuries and replacement drivers
        run: npm run test:injuries

      - name: Test health severity and fatality model
        run: npm run test:health

      - name: Test reserve and emergency replacement drivers
        run: npm run test:replacements

      - name: Test AI reserve hiring and missing ratings fallback
        run: npm run test:ai-reserves

      - name: Test driver contract negotiations
        run: npm run test:negotiations

      - name: Test live lineup and driver role management
        run: npm run test:roles

      - name: Test historical New Game opening state
        run: npm run test:opening-state

      - name: Test historical car materialization rules
        run: npm run test:cars:historical

      - name: Test generated Season Packs
        run: npm run test:season-packs

      - name: Test 2000 Season Pack to canonical Race and official Results
        run: node --test tests/season2000EndToEnd.real.test.js

      - name: Audit 2000 Results-derived Season Pack cars
        run: npm run audit:cars:historical

      - name: Audit historical driver ratings and roles
        run: npm run audit:drivers:historical-calibration

      - name: Audit all-eras historical driver calibration
        run: |
          npm run season:generate
          npm run audit:drivers:all-eras

      - name: Audit all-years driver rating coverage
        run: npm run audit:driver-ratings:all-years

      - name: Audit Teams T3.2 Historical Team Strength
        run: npm run audit:teams:historical-strength

      - name: Audit Teams 3.0 Results-first opening state
        run: npm run audit:teams:results-first

      - name: Audit Teams 3.1B Results-to-Team identity
        run: |
          npm run audit:teams:identity -- --year=2011 --window=2
          npm run audit:teams:identity -- --year=2015 --window=1

      - name: Validate runtime JSON
        run: npm run validate:data

      - name: Build application
        run: npm run build

      - name: Commit generated JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/

          if git diff --cached --quiet; then
            echo "No generated JSON changes to commit."
            exit 0
          fi

          git commit -m "auto: update runtime JSON from Excel"

          # Main can advance while this long validation job is running (for
          # example a docs-only merge that does not trigger this workflow).
          # Rebase the generated-data commit before pushing instead of turning
          # an otherwise-green build red with a non-fast-forward failure.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Generated JSON push raced with another main update (attempt $attempt/3)."
          done

          echo "Unable to push generated JSON after 3 attempts."
          exit 1

  smoke-season-2000:
    name: Real 2000 Season Pack and race smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Export historical database
        run: npm run build:data
      - name: Generate real 2000 opening state
        run: |
          node scripts/build-team-constructor-bridge.mjs
          node scripts/build-team-seasons.mjs
          node scripts/build-driver-history.mjs
          node scripts/build-historical-championships.mjs
          node scripts/build-season-packs.mjs --years=2000
      - name: Test real 2000 car materialization and full race handoff
        run: node --test tests/historicalCarResultBaseline.test.js tests/historicalCarSeasonMaterialization.test.js tests/season2000EndToEnd.real.test.js
      - name: Audit generated 2000 car ranking and provenance
        run: npm run audit:cars:historical
